name: Build Native Installers

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Also lets you trigger a build manually from the GitHub Actions tab
  workflow_dispatch:

jobs:

  # ── LINUX ──────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (.deb + .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install rpm-build (needed for .rpm)
        run: sudo apt-get install -y rpm

      - name: Build Linux packages
        run: mvn clean package -P linux -DskipTests

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: target/dist/linux/
          retention-days: 30

  # ── WINDOWS ────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Windows installer
        run: mvn clean package -P windows -DskipTests

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/dist/windows/
          retention-days: 30

  # ── macOS ───────────────────────────────────────────────────────────────
  build-mac:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build macOS disk image
        run: mvn clean package -P mac -DskipTests

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: target/dist/mac/
          retention-days: 30
