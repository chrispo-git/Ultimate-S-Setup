name: Build Native Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # ── LINUX ──────────────────────────────────────────────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Linux app-image
        run: mvn clean verify -P linux -DskipTests

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/out/UltimateSSetup-linux.tar.gz
          retention-days: 30

  # ── WINDOWS ────────────────────────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Windows app-image
        run: mvn clean verify -P windows -DskipTests

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/out/UltimateSSetup-windows.zip
          retention-days: 30

  # ── macOS ───────────────────────────────────────────────────────────────
  build-mac:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build macOS app-image
        run: mvn clean verify -P mac -DskipTests

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: target/dist/out/UltimateSSetup-mac.zip
          retention-days: 30

  # ── RELEASE ─────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [ build-linux, build-windows, build-mac ]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist/

      - name: Compute release tag
        id: tag
        run: |
          echo "tag=build-$(date +'%Y%m%d')-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Build ${{ steps.tag.outputs.tag }}"
          body: |
            Automated build from commit ${{ github.sha }}

            **Downloads**
            | Platform | File | Notes |
            |----------|------|-------|
            | Linux | `UltimateSSetup-linux.tar.gz` | Extract, then run `UltimateSSetup/bin/UltimateSSetup` |
            | Windows | `UltimateSSetup-windows.zip` | Extract, then run `UltimateSSetup/UltimateSSetup.exe` |
            | macOS | `UltimateSSetup-mac.zip` | Extract, then double-click `UltimateSSetup.app` |

            Place your `ultimate/` folder in the same directory as the executable before running.
          files: |
            dist/UltimateSSetup-linux.tar.gz
            dist/UltimateSSetup-windows.zip
            dist/UltimateSSetup-mac.zip
          fail_on_unmatched_files: true