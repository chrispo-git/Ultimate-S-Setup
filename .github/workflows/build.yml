name: Build Native Installers

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # ── LINUX ──────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (.deb + .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install rpm-build (needed for .rpm)
        run: sudo apt-get install -y rpm

      - name: Build Linux packages
        run: mvn clean package -P linux -DskipTests

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: target/dist/linux/
          retention-days: 30

  # ── WINDOWS ────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Windows installer
        run: mvn clean package -P windows -DskipTests

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/dist/windows/
          retention-days: 30

  # ── macOS ───────────────────────────────────────────────────────────────
  build-mac:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build macOS disk image
        run: mvn clean package -P mac -DskipTests

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: target/dist/mac/
          retention-days: 30

  # ── RELEASE ─────────────────────────────────────────────────────────────
  # Runs after all three builds succeed. Creates a GitHub Release and
  # attaches all three installers to it.
  # Only runs on pushes to main/master (not on pull requests).
  release:
    name: Create Release
    needs: [ build-linux, build-windows, build-mac ]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download all three sets of build artifacts into separate folders
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/linux

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Download macOS disk image
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist/mac

      # Build a short tag like "build-20260321-abc1234" from the date + commit SHA
      - name: Compute release tag
        id: tag
        run: |
          echo "tag=build-$(date +'%Y%m%d')-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # Create the release and upload every file found in dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Build ${{ steps.tag.outputs.tag }}"
          body: |
            Automated build from commit ${{ github.sha }}

            **Downloads**
            | Platform | File |
            |----------|------|
            | Linux | `.deb` and `.rpm` below |
            | Windows | `.exe` installer below |
            | macOS | `.dmg` below |
          files: |
            dist/linux/*
            dist/windows/*
            dist/mac/*
          fail_on_unmatched_files: false